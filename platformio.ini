; BBQ Master — PlatformIO Configuration
;
; Always-on, USB-C powered cooking station monitor.
;   - BLE scanner for Combustion Inc. predictive thermometers
;   - OV2640 camera (MJPEG stream + snapshots) on the XIAO ESP32-S3 Sense
;   - Optional I2C: BME280, BME680, or BME688 (auto-detected)
;
; First:           cp src/secrets.example.h src/secrets.h   (then edit it)
; Build & upload:  pio run -t upload           (XIAO ESP32-S3 Sense, with camera)
;                  pio run -e c6 -t upload     (XIAO ESP32-C6, no camera)
; Serial monitor:  pio device monitor

[platformio]
default_envs = s3-sense

[env]
monitor_speed = 115200

; ─── ESP32-S3 base settings ────────────────────────────
[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    !python3 get_network_flags.py

[cooking_common]
extends = esp32_base
upload_speed = 921600
lib_ldf_mode = chain+
extra_scripts = post:fix_wifi_deps.py
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.2
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit BME680 Library@^2.0.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    esp32-camera

; ─── ESP32-C6 base settings ────────────────────────────────
[esp32c6_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
board_build.partitions = min_spiffs.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNO_CAMERA=1
    !python3 get_network_flags.py

[cooking_c6_common]
extends = esp32c6_base
upload_speed = 921600
lib_ldf_mode = chain+
extra_scripts = post:fix_wifi_deps.py
build_src_filter = +<*> -<camera.cpp>
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.2
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit BME680 Library@^2.0.4
    adafruit/Adafruit Unified Sensor@^1.1.14

; ─── Environments ─────────────────────────────────────────
; Give each unit its own identity by adding to build_flags, e.g.:
;     -DDEVICE_ID=\"bbq-2\"
;     -DDEVICE_HOSTNAME=\"bbqmaster-2\"
;     -DDEVICE_LOCATION=\"Smoker\"

; XIAO ESP32-S3 Sense: BLE + camera + WiFi
[env:s3-sense]
extends = cooking_common

; XIAO ESP32-C6: BLE + WiFi, no camera
[env:c6]
extends = cooking_c6_common
